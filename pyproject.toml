[project]
name = "commerce-analysis-agent"
version = "0.2.0"
description = "Commerce analysis assistant with evidence-grounded, durable Agent workflows"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.25",
    "langchain==1.4.5",
    "langgraph==1.2.15",
    "langchain-openai>=1.2.1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langgraph-checkpoint-postgres>=3,<4",
    "sqlalchemy>=2.0.40,<3",
    "alembic>=1.15,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "reportlab>=4.3,<5",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
