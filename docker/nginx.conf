map $realip_remote_addr $upstream_scheme {
    default $scheme;
    ${TRUSTED_INGRESS_IP} $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    # Only the fixed Caddy hop may supply an end-user address. Direct client
    # forwarding headers are ignored, then overwritten on the API hop.
    set_real_ip_from ${TRUSTED_INGRESS_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
